server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React single-page app at every client-side route.  Static
    # files are served directly; unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
